name: CI

on:
  push:
  pull_request:

jobs:
  macos-correctness:
    name: macOS compilation and correctness
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake --preset macos-release
      - name: Build
        run: cmake --build --preset macos-release
      - name: Test
        run: ctest --preset macos-release
        env:
          # Hosted macOS 14 Accelerate allocates inside steady-state BLAS calls.
          # CI gates compilation and mathematical correctness; reference Macs
          # retain the strict opaque-library allocation assertions by default.
          SKBENCH_SKIP_ACCELERATE_ALLOCATION_ASSERTIONS: "1"
      - name: Exercise result contract
        run: build/release/skbench run --profile smoke --output results/local/ci-smoke.json
      - name: Check JSON syntax
        run: python3 -m json.tool results/local/ci-smoke.json >/dev/null
      - name: Check emitted precision and placement contract
        run: python3 -c 'import json; result=json.load(open("results/local/ci-smoke.json", encoding="utf-8")); assert result["numericType"] == {"id":"float64","scalarBits":64}; assert all(set(provider["executionContract"]) == {"forward","inverse"} for provider in result["providers"])'
      - name: Validate current publication
        run: python3 tools/validate_publication.py
      - name: Enforce append-only publication against pull-request base
        if: github.event_name == 'pull_request'
        run: python3 tools/validate_publication.py --baseline-ref "${{ github.event.pull_request.base.sha }}"
      - name: Enforce append-only publication against previous push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 tools/validate_publication.py --baseline-ref "${{ github.event.before }}"
      - name: Test and build benchmark archive
        run: |
          python3 -m unittest tests/test_publication.py tests/test_build_site.py tests/test_fftw_native_order_sweep.py tests/test_retained_horizontal_closeout_sweep.py tests/test_pointwise_advection_screen.py tests/test_pointwise_advection_reference.py tests/test_portable_machine_tuning.py
          python3 tools/build_site.py --output _site
